name: Sync static model snapshot

on:
  schedule:
    - cron: "17 * * * *"
    # Daily: refresh the reference renders from venice.ai/models.
    - cron: "41 4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [outerface-deployed]

permissions:
  contents: write

concurrency:
  group: sync-static-models
  cancel-in-progress: false

jobs:
  sync-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Refresh static model-driven documentation
        run: node scripts/update-static-models.js

      # Incremental: only models whose constraints changed, plus a weekly refresh.
      - name: Refresh video price matrix
        run: node scripts/quote-video-pricing.js

      - name: Refresh reference renders
        if: github.event_name != 'schedule' || github.event.schedule == '41 4 * * *'
        run: node scripts/sync-model-media.js

      - name: Build model hub
        run: node scripts/build-model-catalog.js

      # git status (not git diff) so new and deleted model pages count as changes.
      - name: Check for generated changes
        id: diff
        run: |
          paths="data overview/pricing.mdx overview/about-venice.mdx overview/deprecations.mdx api-reference/endpoint/models/traits.mdx models docs.json"
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated snapshot
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add -A -- data overview/pricing.mdx overview/about-venice.mdx overview/deprecations.mdx api-reference/endpoint/models/traits.mdx models docs.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: sync static model snapshot"

      - name: Push updated snapshot
        if: steps.diff.outputs.changed == 'true'
        run: git push origin HEAD:main

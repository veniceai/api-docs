name: Sync static model snapshot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [outerface-deployed]

permissions:
  contents: write

concurrency:
  group: sync-static-models
  cancel-in-progress: false

jobs:
  sync-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Refresh static model-driven documentation
        run: node scripts/update-static-models.js

      - name: Check for generated changes
        id: diff
        run: |
          if git diff --quiet -- \
            data/static-models.json \
            data/static-traits.json \
            overview/pricing.mdx \
            overview/about-venice.mdx \
            overview/deprecations.mdx \
            api-reference/endpoint/models/traits.mdx \
            models/overview.mdx \
            models/text.mdx \
            models/image.mdx \
            models/video.mdx \
            models/text-to-speech.mdx \
            models/speech-to-text.mdx \
            models/music.mdx \
            models/embeddings.mdx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated snapshot
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add \
            data/static-models.json \
            data/static-traits.json \
            overview/pricing.mdx \
            overview/about-venice.mdx \
            overview/deprecations.mdx \
            api-reference/endpoint/models/traits.mdx \
            models/overview.mdx \
            models/text.mdx \
            models/image.mdx \
            models/video.mdx \
            models/text-to-speech.mdx \
            models/speech-to-text.mdx \
            models/music.mdx \
            models/embeddings.mdx
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: sync static model snapshot"

      - name: Push updated snapshot
        if: steps.diff.outputs.changed == 'true'
        run: git push origin HEAD:main

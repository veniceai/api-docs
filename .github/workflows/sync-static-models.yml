name: Sync static model snapshot

on:
  schedule:
    - cron: "17 * * * *"
    # Daily: refresh the reference renders from venice.ai/models.
    - cron: "41 4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [outerface-deployed]

permissions:
  contents: write

concurrency:
  group: sync-static-models
  cancel-in-progress: false

env:
  # Every file the sync scripts write. The change check and the commit both
  # use this list, so nothing else in the checkout can be committed.
  # models/*.mdx and snippets/model-hub/*.mdx are git pathspecs: the /models
  # tables, the generated model pages and every page's first screen, including
  # ones a run deletes.
  GENERATED_PATHS: >-
    data/static-models.json
    data/static-traits.json
    data/removed-deprecations.json
    data/video-pricing.json
    data/model-media.json
    data/model-catalog.json
    overview/pricing.mdx
    overview/about-venice.mdx
    overview/deprecations.mdx
    api-reference/endpoint/models/traits.mdx
    models/*.mdx
    snippets/model-hub/*.mdx
    docs.json
    llms.txt

jobs:
  sync-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # The /models tables read data/model-catalog.json, so they are
      # generated last, after the catalog build below.
      - name: Refresh static model-driven documentation
        run: node scripts/update-static-models.js --skip-models-static

      # Incremental: only models whose constraints changed, plus a weekly refresh.
      - name: Refresh video price matrix
        run: node scripts/quote-video-pricing.js

      - name: Refresh reference renders
        if: github.event_name != 'schedule' || github.event.schedule == '41 4 * * *'
        run: node scripts/sync-model-media.js

      - name: Build model hub
        run: node scripts/build-model-catalog.js

      - name: Regenerate static model catalogs
        run: node scripts/generate-models-static.js

      # git status (not git diff) so new and deleted files count as changes.
      # GENERATED_PATHS is unquoted on purpose, one pathspec per word, with
      # globbing off (set -f) so git, not the shell, matches models/*.mdx.
      - name: Check for generated changes
        id: diff
        run: |
          set -f
          if [ -z "$(git status --porcelain -- $GENERATED_PATHS)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated snapshot
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -f
          git add -A -- $GENERATED_PATHS
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: sync static model snapshot"

      - name: Push updated snapshot
        if: steps.diff.outputs.changed == 'true'
        run: git push origin HEAD:main

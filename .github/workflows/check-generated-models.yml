name: Check generated model files

# The hub bundle, the static model tables, pricing.md and changelog.mdx are
# generated and committed. Rebuild them from the branch and fail if they differ
# from what it commits.
# Offline: reads only the committed data/ snapshots, never the Venice API.
on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "data/**"
      - "models/**"
      - "pricing.md"
      - "changelog.mdx"
      - "snippets/model-hub-mount.jsx"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/check-generated-models.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      # The bundle build needs sucrase, a devDependency.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Rebuild the model hub bundle
        run: node scripts/build-model-hub.js

      - name: Regenerate the static model tables
        run: node scripts/generate-models-static.js

      - name: Regenerate pricing.md
        run: node scripts/generate-pricing-md.js

      - name: Regenerate the changelog
        run: node scripts/generate-changelog.js

      # git status (not git diff) so new and deleted files count too.
      - name: Fail on generated drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff --stat
            echo "::error::Generated files are out of date. Run node scripts/build-model-hub.js, node scripts/generate-models-static.js, node scripts/generate-pricing-md.js and node scripts/generate-changelog.js, then commit the result."
            exit 1
          fi
